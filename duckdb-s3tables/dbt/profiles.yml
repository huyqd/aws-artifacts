# Run dbt from this directory:  dbt build --profiles-dir .
# The Iceberg catalog itself (endpoint, bucket) is in catalogs.yml.
duckdb_s3tables:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ":memory:"
      threads: 1
      extensions:
        - iceberg
        - aws
        - httpfs
      secrets:
        - type: s3
          name: s3_tables_secret
          provider: credential_chain
          region: "{{ env_var('AWS_REGION', 'eu-central-1') }}"
